name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:


jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lets_get_testy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lets_get_testy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Apply database schema and seed data
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -h localhost -p 5432 -U postgres -d lets_get_testy \
            -v ON_ERROR_STOP=1 -f database/init.sql
      - name: Build and run tests (JUnit)
        run: ./mvnw -B verify

  e2e:
    needs: [backend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lets_get_testy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lets_get_testy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: src/backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Apply database schema and seed data
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d lets_get_testy \
            -v ON_ERROR_STOP=1 -f src/backend/database/init.sql
      - name: Package backend (skip tests; JUnit already ran in backend job)
        working-directory: src/backend
        run: ./mvnw -B -DskipTests package
      - name: Start backend
        working-directory: src/backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lets_get_testy?user=postgres&password=postgres
          APP_AUTH_JWT_SECRET: test-jwt-secret
          SPRING_PROFILES_ACTIVE: dev
        run: |
          nohup java -jar target/backend-0.0.1-SNAPSHOT.jar > /tmp/backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
      - name: Wait for backend API
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/events || true)
            if [ "$code" = "401" ]; then
              echo "Backend is up (GET /api/events returned 401 without token, expected)"
              exit 0
            fi
            sleep 2
          done
          echo "--- backend.log ---"
          cat /tmp/backend.log || true
          exit 1
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        working-directory: src/frontend
        env:
          CI: true
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/frontend/playwright-report/
            src/frontend/test-results/
          if-no-files-found: ignore

  load-test-gate:
    needs: [backend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lets_get_testy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lets_get_testy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Apply database schema and seed data
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d lets_get_testy \
            -v ON_ERROR_STOP=1 -f database/init.sql
      - name: Package backend (skip tests)
        run: ./mvnw -B -DskipTests package
      - name: Start backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lets_get_testy?user=postgres&password=postgres
          APP_AUTH_JWT_SECRET: test-jwt-secret
        run: |
          nohup java -jar target/backend-0.0.1-SNAPSHOT.jar > /tmp/backend-load.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
      - name: Wait for backend API
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/test || true)
            if [ "$code" = "200" ]; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "--- backend-load.log ---"
          cat /tmp/backend-load.log || true
          exit 1
      - name: Run load-test CI gate (k6)
        working-directory: src/backend/src/test/performance
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work/src/backend/src/test/performance \
            grafana/k6 run \
            -e BASE_URL=http://host.docker.internal:8080 \
            -e VUS_BROWSE=80 \
            -e VUS_RESERVATIONS=30 \
            -e TEST_DURATION=2m \
            loadtest.ts
      - name: Upload load-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            src/backend/src/test/performance/loadtest-summary.json
            src/backend/src/test/performance/loadtest-summary.csv
          if-no-files-found: warn

  stress-test:
    if: github.event_name == 'workflow_dispatch'
    needs: [load-test-gate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Require Supabase secrets for stress test
        env:
          STRESS_JDBC: ${{ secrets.STRESS_TEST_SPRING_DATASOURCE_URL }}
          STRESS_JWT: ${{ secrets.STRESS_TEST_APP_AUTH_JWT_SECRET }}
        run: |
          if [ -z "$STRESS_JDBC" ] || [ -z "$STRESS_JWT" ]; then
            echo "::error::Add repo secrets STRESS_TEST_SPRING_DATASOURCE_URL (full JDBC URL) and STRESS_TEST_APP_AUTH_JWT_SECRET."
            exit 1
          fi
      - name: Package backend (skip tests)
        run: ./mvnw -B -DskipTests package
      - name: Start backend (Supabase)
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.STRESS_TEST_SPRING_DATASOURCE_URL }}
          APP_AUTH_JWT_SECRET: ${{ secrets.STRESS_TEST_APP_AUTH_JWT_SECRET }}
        run: |
          nohup java -jar target/backend-0.0.1-SNAPSHOT.jar > /tmp/backend-stress.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
      - name: Wait for backend API
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/test || true)
            if [ "$code" = "200" ]; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "--- backend-stress.log ---"
          cat /tmp/backend-stress.log || true
          exit 1
      - name: Run stress test (k6)
        working-directory: src/backend/src/test/performance
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work/src/backend/src/test/performance \
            grafana/k6 run \
            -e BASE_URL=http://host.docker.internal:8080 \
            stresstest.ts
      - name: Upload stress-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: |
            src/backend/src/test/performance/stresstest-summary.json
            src/backend/src/test/performance/stresstest-summary.csv
          if-no-files-found: warn
