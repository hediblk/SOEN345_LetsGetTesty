spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:src/backend/.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/lets_get_testy
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:letsgettesty-dev-jwt-secret-change-me}
app.auth.jwt-expiration-seconds=86400

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${APP_NOTIFICATION_EMAIL:}
spring.mail.password=${APP_NOTIFICATION_EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
