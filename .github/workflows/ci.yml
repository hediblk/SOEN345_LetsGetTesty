name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lets_get_testy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lets_get_testy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Apply database schema and seed data
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -h localhost -p 5432 -U postgres -d lets_get_testy \
            -v ON_ERROR_STOP=1 -f database/init.sql
      - name: Build and run tests (JUnit)
        run: ./mvnw -B verify
